<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CollabCanvas — Real-time Multiplayer Collaborative Whiteboard & Party Games</title>
  <meta name="description" content="Infinite real-time collaborative canvas with classroom teaching tools, presenter controls, and multiplayer drawing games." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- View Container: Routed dynamically between Dashboard and Canvas Room -->
    <div id="view-container"></div>

    <!-- Global Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Global Modals (rendered as needed) -->
    <div id="modal-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
